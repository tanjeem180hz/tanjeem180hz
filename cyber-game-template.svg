name: Update Cyber Game

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get GitHub Stats
        run: |
          USERNAME="tanjeem_817"

          FOLLOWERS=$(curl -s "https://api.github.com/users/$USERNAME" | jq -r '.followers // 0')

          STARS=$(curl -s "https://api.github.com/users/$USERNAME/repos?per_page=100" \
            | jq '[.[].stargazers_count] | add // 0')

          echo "FOLLOWERS=$FOLLOWERS" >> $GITHUB_ENV
          echo "STARS=$STARS" >> $GITHUB_ENV

      - name: Build SVG
        run: |
          cp cyber-game-template.svg cyber-game.svg

          sed -i "s/{{FOLLOWERS}}/${FOLLOWERS}/g" cyber-game.svg
          sed -i "s/{{STARS}}/${STARS}/g" cyber-game.svg

          sed -i "s/{{VIEWS}}/LIVE/g" cyber-game.svg

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cyber-game.svg

          git diff --cached --quiet || git commit -m "Update cyber game stats"

          git push
